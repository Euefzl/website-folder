<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
    <style>
        .box {
            width: 400px;
            margin: 100px auto;
            padding: 30px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="box">
        <h2>账号注册</h2>
        <el-form :model="form">
            <el-form-item label="账号">
                <el-input v-model="form.username"></el-input>
            </el-form-item>
            <el-form-item label="密码">
                <el-input v-model="form.password" type="password"></el-input>
            </el-form-item>
            <el-button type="primary" @click="reg" style="width:100%">注册</el-button>
            <el-button style="width:100%;margin-top:10px" @click="goLogin">返回登录</el-button>
        </el-form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
const { createApp } = Vue;

// 关键：把跳转逻辑改成用 window.location，避免 undefined 问题
createApp({
    data() {
        return {
            form: {
                username: "",
                password: ""
            }
        }
    },
    methods: {
        async reg() {
            const res = await axios.post("http://localhost:8081/user/register", this.form);
            if (res.data.code === 200) {
                alert("注册成功！请登录");
                // 改用 window.location.href 保证跳转正常
                window.location.href = "login.html";
            } else {
                alert(res.data.msg);
            }
        },
        goLogin() {
            window.location.href = "login.html";
        }
    }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
