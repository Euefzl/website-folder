<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新闻管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
</head>
<body>
<div id="app" style="width:90%;margin:30px auto">
    <h2>📰 新闻管理系统
        <el-button type="danger" @click="logout" style="float:right">退出登录</el-button>
    </h2>
    <el-card style="margin-bottom:20px">
        <el-form :model="form" label-width="80px" inline>
            <el-form-item label="标题"><el-input v-model="form.title"></el-input></el-form-item>
            <el-form-item label="作者"><el-input v-model="form.author"></el-input></el-form-item>
            <el-form-item label="内容"><el-input v-model="form.content" type="textarea" rows="3"></el-input></el-form-item>
            <el-button type="primary" @click="add">提交</el-button>
        </el-form>
    </el-card>
    <el-table :data="list" border>
        <el-table-column prop="id" label="ID"></el-table-column>
        <el-table-column prop="title" label="标题"></el-table-column>
        <el-table-column prop="content" label="内容"></el-table-column>
        <el-table-column prop="author" label="作者"></el-table-column>
        <el-table-column prop="createTime" label="时间"></el-table-column>
        <el-table-column label="操作">
            <el-button type="danger" size="small" @click="del(row.id)" v-for="row in list">删除</el-button>
        </el-table-column>
    </el-table>
</div>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
const { createApp } = Vue;
axios.defaults.withCredentials = true;
axios.interceptors.response.use(res=>res,err=>{
    if(err.response.status === 401){location.href="login.html"}
    return Promise.reject(err)
})
createApp({
    data(){return{list:[],form:{title:"",author:"",content:""}}},
    mounted(){this.getList()},
    methods:{
        async getList(){
            const res = await axios.get("http://localhost:8081/news/page");
            this.list = res.data.data.records;
        },
        async add(){
            await axios.post("http://localhost:8081/news/add",this.form);
            this.form = {};
            this.getList();
        },
        async del(id){
            await axios.delete("http://localhost:8081/news/delete/"+id);
            this.getList();
        },
        async logout(){
            await axios.post("http://localhost:8081/user/logout");
            location.href="login.html";
        }
    }
}).use(ElementPlus).mount('#app')
</script>
</body>
</html>
